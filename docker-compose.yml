version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nix-chatbot-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3000
    restart: unless-stopped
    networks:
      - nix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nix-chatbot-frontend
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nix-network

networks:
  nix-network:
    driver: bridge
